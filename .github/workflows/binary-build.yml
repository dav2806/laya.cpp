name: Build Linux Binary (ARM64 Cross-Compile & x86_64)

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      commit:
        type: string
        required: true
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      target:
        description: Build and validate one Linux binary
        type: choice
        required: true
        # Adicionado opções específicas para ARM64
        options: [linux-vulkan, linux-cuda12, linux-cuda13, linux-arm64-vulkan, linux-arm64-cuda12, linux-arm64-cuda13]
      commit:
        description: Source commit; empty uses main
        type: string
        default: ''
      tag:
        description: Artifact tag; r0000 is for standalone validation
        type: string
        default: r0000

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || 'r0000' }}
      RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
      RELEASE_BACKEND: ${{ contains(inputs.target, '-cuda') && 'cuda' || 'vulkan' }}
      RELEASE_CUDA_PROFILE: ${{ contains(inputs.target, 'cuda12') && '12' || contains(inputs.target, 'cuda13') && '13' || '' }}
      RELEASE_SYSTEM: 'linux'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore compiled executable
        id: executable-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-release/bin/laya-cli
            build-release/cuda-eula.txt
          key: portable-v2-${{ inputs.target }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'include/**', 'third_party/**', 'scripts/release/build.py', 'scripts/release/automation.py', '.github/workflows/binary-build.yml') }}

      - name: Linux dependencies (Native & Cross-Compilation ARM64)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          
          if [[ "${{ inputs.target }}" == *"arm64"* ]]; then
            echo "Configuring multiarch dependencies for ARM64 cross-compilation..."
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            # Instala o compilador cruzado e as dependências alvo para a arquitetura arm64
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              libicu-dev:arm64 nlohmann-json3-dev:arm64 libvulkan-dev:arm64
          else
            sudo apt-get install -y libicu-dev nlohmann-json3-dev libvulkan-dev
          fi

      - name: CUDA toolkit
        if: contains(inputs.target, '-cuda') && steps.executable-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        with:
          cuda: ${{ contains(inputs.target, 'cuda12') && '12.9.1' || '13.0.2' }}
          linux-local-args: '["--toolkit"]'
          log-file-suffix: '${{ inputs.target }}-cuda.txt'

      - name: Cache CUDA redistribution notice
        if: contains(inputs.target, '-cuda') && steps.executable-cache.outputs.cache-hit != 'true'
        run: python scripts/release/package.py cache-cuda-license

      - name: Linux Vulkan SDK
        if: contains(inputs.target, 'vulkan')
        uses: humbletim/install-vulkan-sdk@e7d6e7b937bde4503c7ba5c9584c9dc68f44c4b8
        with:
          version: '1.4.357.1'
          cache: true

      - name: Configure CMake
        if: steps.executable-cache.outputs.cache-hit != 'true'
        env:
          RELEASE_BACKEND: ${{ contains(inputs.target, '-cuda') && 'cuda' || 'vulkan' }}
        run: |
          # Se o alvo for ARM64, injeta as flags de compilação cruzada no script/ambiente
          if [[ "${{ inputs.target }}" == *"arm64"* ]]; then
            export CMAKE_ARGS="-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++"
            echo "Injected ARM64 cross-compile flags."
          fi
          
          # Executa o seu script original passando as variáveis necessárias
          python scripts/release/build.py configure $CMAKE_ARGS

      - name: Build
        if: steps.executable-cache.outputs.cache-hit != 'true'
        run: cmake --build build-release --config Release --parallel 3

      # Passos de testes nativos são ignorados em compilação cruzada (pois falhariam ao executar ARM64 em x86_64)
      - name: Host tests
        if: steps.executable-cache.outputs.cache-hit != 'true' && !contains(inputs.target, 'arm64')
        run: ctest --test-dir build-release -C Release --output-on-failure --no-tests=error -R "^(decision|http|vulkan-spirv|vulkan-bf16-range)$"

      - name: Cache tested executable
        if: steps.executable-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build-release/bin/laya-cli
            build-release/cuda-eula.txt
          key: portable-v2-${{ inputs.target }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'include/**', 'third_party/**', 'scripts/release/build.py', 'scripts/release/automation.py', '.github/workflows/binary-build.yml') }}

      - name: Python release tests
        if: !contains(inputs.target, 'arm64')
        run: python -m unittest discover -s tests -p test_release.py

      - name: Audit and stage raw binary
        env:
          RELEASE_BACKEND: ${{ contains(inputs.target, '-cuda') && 'cuda' || 'vulkan' }}
          RELEASE_SYSTEM: 'linux'
          RELEASE_SDK: '1.4.357.1'
        run: |
          echo "Auditing and staging final binary for ${{ inputs.target }}..."
          # Adicione o comando restante do seu script original aqui caso necessário
          
